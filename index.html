<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .portal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dashboard-container { max-width: 800px; }
        h2, h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
        p { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 24px; }
        input {
            width: 100%; padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px; color: var(--text-primary);
            font-size: 0.875rem; outline: none; margin-bottom: 16px;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%; padding: 10px 16px;
            background-color: var(--accent); color: white;
            border: none; border-radius: 6px; font-weight: 500; cursor: pointer;
        }
        button:hover { background-color: var(--accent-hover); }
        .btn-danger {
            background-color: transparent; border: 1px solid var(--border-color);
            color: var(--text-secondary); margin-top: 24px;
        }
        .btn-danger:hover { background-color: var(--danger); border-color: var(--danger); color: white; }
        .error-message { color: var(--danger); font-size: 0.8rem; margin-top: 8px; }
        .nav-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px; margin-top: 20px;
        }
        .nav-item {
            background-color: var(--bg-color); border: 1px solid var(--border-color);
            padding: 16px; border-radius: 6px; text-decoration: none; color: var(--text-primary);
            display: flex; flex-direction: column; transition: border-color 0.2s;
        }
        .nav-item:hover { border-color: var(--accent); }
        .nav-title { font-weight: 500; font-size: 0.95rem; margin-bottom: 4px; }
        .nav-desc { font-size: 0.75rem; color: var(--text-secondary); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- INLOGSCHERM -->
    <div id="loginScreen" class="portal-card">
        <h2>Systeemauthenticatie</h2>
        <p>Voer het wachtwoord in om door te gaan.</p>
        <form id="loginForm">
            <input type="password" id="passwordInput" placeholder="Wachtwoord (geheim123)" required>
            <button type="submit">Authenticeer</button>
        </form>
        <div id="errorMsg" class="error-message"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="mainScreen" class="portal-card dashboard-container hidden">
        <h2>Systeemoverzicht</h2>
        <p>Snelle toegang tot resources.</p>
        <div class="nav-grid">
            <a href="https://www.google.com" target="_blank" class="nav-item">
                <span class="nav-title">Google</span>
                <span class="nav-desc">Zoekmachine</span>
            </a>
            <a href="https://github.com" target="_blank" class="nav-item">
                <span class="nav-title">GitHub</span>
                <span class="nav-desc">Versiebeheer</span>
            </a>
        </div>
        <button class="btn-danger" id="logoutBtn">Uitloggen</button>
    </div>

    <script>
        const loginScreen = document.getElementById('loginScreen');
        const mainScreen = document.getElementById('mainScreen');
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('errorMsg');
        const logoutBtn = document.getElementById('logoutBtn');

        if (sessionStorage.getItem('isAuthenticated') === 'true') { grantAccess(); }

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (passwordInput.value === "geheim123") {
                sessionStorage.setItem('isAuthenticated', 'true');
                grantAccess();
            } else {
                errorMsg.textContent = "Onjuist wachtwoord.";
                passwordInput.value = "";
            }
        });

        logoutBtn.addEventListener('click', function() {
            sessionStorage.removeItem('isAuthenticated');
            mainScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            passwordInput.value = "";
        });

        function grantAccess() {
            loginScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
